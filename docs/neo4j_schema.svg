<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="rh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="#f6efe1"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#3a2f22" font-family="Georgia,serif">Neo4j Schema — causal flood graph</text>
  <text x="30" y="62" font-size="13" fill="#8a6d3b">ผลแบบ <tspan font-family="monospace" fill="#c0492f">CALL db.schema.visualization()</tspan> — 5 labels · 5 relationship types (ทิศลูกศร = ทิศการไหลของน้ำ)</text>

  <!-- ===== edges (under nodes) ===== -->
  <g stroke="#9aa7b4" stroke-width="2.2" fill="none">
    <!-- FEEDS: RainStation -> Reservoir -->
    <path d="M172,217 L369,139" marker-end="url(#rh)"/>
    <!-- RUNOFF_TO: RainStation -> RiverReach -->
    <path d="M174,245 L470,305" marker-end="url(#rh)"/>
    <!-- OVERFLOWS_TO: Reservoir -> RiverReach -->
    <path d="M440,164 L498,268" marker-end="url(#rh)"/>
    <!-- FLOWS_TO self-loop on RiverReach (top) -->
    <path d="M503,262 C497,205 553,205 547,262" marker-end="url(#rh)"/>
    <!-- FLOWS_TO: RiverReach -> Confluence (outer bow, lower-left) -->
    <path d="M470,357 C405,430 380,438 345,440" marker-end="url(#rh)"/>
    <!-- FLOWS_TO: Confluence -> RiverReach (inner bow, upper) -->
    <path d="M336,432 C440,405 470,392 494,362" marker-end="url(#rh)"/>
    <!-- INUNDATES: RiverReach -> Province -->
    <path d="M581,315 L789,315" marker-end="url(#rh)"/>
  </g>

  <!-- ===== relationship type labels (each in open space) ===== -->
  <g font-family="monospace" font-size="12" font-weight="700">
    <g><rect x="238" y="158" width="62" height="20" rx="10" fill="#fff" stroke="#cdbfa2"/><text x="269" y="172" fill="#4a5f7a" text-anchor="middle">FEEDS</text></g>
    <g><rect x="252" y="266" width="92" height="20" rx="10" fill="#fff" stroke="#cdbfa2"/><text x="298" y="280" fill="#4a5f7a" text-anchor="middle">RUNOFF_TO</text></g>
    <g><rect x="356" y="196" width="112" height="20" rx="10" fill="#fff" stroke="#cdbfa2"/><text x="412" y="210" fill="#4a5f7a" text-anchor="middle">OVERFLOWS_TO</text></g>
    <g><rect x="484" y="176" width="82" height="20" rx="10" fill="#fff" stroke="#cdbfa2"/><text x="525" y="190" fill="#4a5f7a" text-anchor="middle">FLOWS_TO</text></g>
    <g><rect x="368" y="392" width="82" height="20" rx="10" fill="#fff" stroke="#cdbfa2"/><text x="409" y="406" fill="#4a5f7a" text-anchor="middle">FLOWS_TO</text></g>
    <g><rect x="644" y="292" width="82" height="20" rx="10" fill="#fff" stroke="#cdbfa2"/><text x="685" y="306" fill="#4a5f7a" text-anchor="middle">INUNDATES</text></g>
  </g>

  <!-- ===== nodes (Neo4j-style solid circles) ===== -->
  <g font-weight="700" text-anchor="middle">
    <circle cx="125" cy="235" r="50" fill="#FFC454"/><text x="125" y="232" font-size="13" fill="#3a2f22">Rain</text><text x="125" y="248" font-size="13" fill="#3a2f22">Station</text>
    <circle cx="415" cy="120" r="50" fill="#57C7E3"/><text x="415" y="125" font-size="13" fill="#134b57">Reservoir</text>
    <circle cx="525" cy="315" r="55" fill="#4C8EDA"/><text x="525" y="312" font-size="13" fill="#fff">River</text><text x="525" y="328" font-size="13" fill="#fff">Reach</text>
    <circle cx="300" cy="470" r="48" fill="#8DCC93"/><text x="300" y="475" font-size="12.5" fill="#17402a">Confluence</text>
    <circle cx="840" cy="315" r="50" fill="#F16667"/><text x="840" y="320" font-size="13" fill="#fff">Province</text>
  </g>

  <!-- ===== properties note ===== -->
  <g font-size="11.5" fill="#6a5a42">
    <rect x="30" y="508" width="920" height="74" rx="10" fill="#fbf3e6" stroke="#b8801f" stroke-width="1.2"/>
    <text x="44" y="530" font-weight="700" fill="#8a6d3b" font-size="12.5">Properties (ย่อ):</text>
    <text x="44" y="550">• ทุก relationship มี <tspan font-family="monospace" fill="#c0492f">evidence</tspan> (JSON string → station/timestamp/dataset) + <tspan font-family="monospace">lag_hours</tspan> · RiverReach มี <tspan font-family="monospace">subbasin</tspan>, <tspan font-family="monospace">overflow</tspan> (จาก RID gauge)</text>
    <text x="44" y="568">• Province มี <tspan font-family="monospace">protected</tspan> (คันกั้นน้ำ) · ทำนายเมื่อ last_reach.overflow=true และ protected=false · hop = <tspan font-family="monospace">*2..8</tspan> จาก RainStation</text>
  </g>
</svg>
