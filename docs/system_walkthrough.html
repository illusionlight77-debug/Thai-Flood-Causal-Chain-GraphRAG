<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Walkthrough — Thai Flood Causal-Chain GraphRAG</title>
<style>
  :root{
    --paper:#f6efe1; --panel:#fbf6ec; --ink:#3a2f22; --ochre:#8a6d3b; --rust:#c0492f;
    --teal:#2f6b8a; --green:#2f7d4a; --line:#e0d3ba;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Segoe UI',system-ui,Arial,sans-serif;line-height:1.5}
  header{padding:26px 28px 14px;border-bottom:2px solid var(--line)}
  h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:26px;color:var(--ink)}
  .sub{margin:6px 0 0;color:var(--ochre);font-size:14px}
  nav{display:flex;flex-wrap:wrap;gap:8px;padding:16px 28px;position:sticky;top:0;
    background:var(--paper);border-bottom:1px solid var(--line);z-index:5}
  .tab{border:1.6px solid var(--ochre);background:var(--panel);color:var(--ink);
    padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13.5px;font-weight:600;
    transition:.15s}
  .tab:hover{background:#f1e7d3}
  .tab.active{background:var(--ink);color:#f6efe1;border-color:var(--ink)}
  .tab.core{border-color:var(--green)}
  .tab.core.active{background:var(--green);border-color:var(--green)}
  main{padding:22px 28px 60px;max-width:1120px;margin:0 auto}
  .panel{display:none;animation:fade .25s ease}
  .panel.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .cap{font-size:14px;color:var(--ochre);margin:0 0 12px}
  .frame{background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:10px;box-shadow:0 2px 10px rgba(80,60,30,.06)}
  .frame img{display:block;width:100%;height:auto;border-radius:6px}
  .nextrow{display:flex;justify-content:space-between;margin-top:18px}
  .navbtn{border:1.4px solid var(--ochre);background:var(--panel);border-radius:8px;
    padding:8px 16px;cursor:pointer;font-size:13px;color:var(--ink)}
  .navbtn:disabled{opacity:.35;cursor:default}
  footer{padding:14px 28px 40px;color:#8a97a8;font-size:12.5px;text-align:center}
  a{color:var(--teal)}
</style>
</head>
<body>
<header>
  <h1>System Walkthrough</h1>
  <p class="sub">Thai Flood Causal-Chain GraphRAG — click through the overview and each building block</p>
</header>

<nav id="tabs"></nav>

<main id="stage"></main>

<footer>
  Read the story: <a href="STORY.md">STORY.md</a> · full technical book: <a href="SYSTEM_DEVELOPMENT.md">SYSTEM_DEVELOPMENT.md</a>
</footer>

<script>
const STEPS = [
  {id:"overview", label:"◎ Overview", img:"system_overview_en.svg",
    cap:"The whole system: band ① the causal chain we follow, band ② the system we built to measure it."},
  {id:"b1", label:"① Ingestion & Graph", img:"blocks/block1_ingest_en.svg",
    cap:"Turn real data into a causal graph in Neo4j — every edge carries evidence; overflow is de-circularized."},
  {id:"b2", label:"② Geo Mapping", img:"blocks/block2_geo_en.svg",
    cap:"GeoPandas point-in-polygon maps reach→province; satellite overlay lays down the gold answer key."},
  {id:"b3", label:"③ 3 Retrievers ★", img:"blocks/block3_retrievers_en.svg", core:true,
    cap:"The core: causal follows real flow (chain + evidence), entity ignores direction, vector reads news."},
  {id:"b4", label:"④ Evaluation", img:"blocks/block4_eval_en.svg",
    cap:"Score vs GISTDA on a frozen eval set + statistical confirmation — old and new numbers reported together."},
  {id:"b5", label:"⑤ DEM Validation", img:"blocks/block5_dem_en.svg",
    cap:"Independent physics: real satellite elevation checks that water flows the way the graph claims."},
  {id:"b6", label:"⑥ Extension", img:"blocks/block6_extension_en.svg",
    cap:"Add-on forecasting/risk — wraps warnings with grounded numbers + why it might not happen."},
];

const tabsEl = document.getElementById("tabs");
const stageEl = document.getElementById("stage");
let cur = 0;

STEPS.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="tab"+(s.core?" core":"");
  b.textContent=s.label;
  b.onclick=()=>show(i);
  tabsEl.appendChild(b);

  const p=document.createElement("section");
  p.className="panel";
  p.innerHTML=`<p class="cap">${s.cap}</p>
    <div class="frame"><img src="${s.img}" alt="${s.label}" loading="lazy"></div>
    <div class="nextrow">
      <button class="navbtn" data-d="-1">‹ Prev</button>
      <button class="navbtn" data-d="1">Next ›</button>
    </div>`;
  stageEl.appendChild(p);
});

function show(i){
  cur=i;
  document.querySelectorAll(".tab").forEach((t,k)=>t.classList.toggle("active",k===i));
  document.querySelectorAll(".panel").forEach((p,k)=>p.classList.toggle("show",k===i));
  const btns=document.querySelectorAll(".panel")[i].querySelectorAll(".navbtn");
  btns[0].disabled=(i===0); btns[1].disabled=(i===STEPS.length-1);
  if(location.hash!=="#"+STEPS[i].id) history.replaceState(null,"","#"+STEPS[i].id);
}
stageEl.addEventListener("click",e=>{
  const d=e.target.getAttribute&&e.target.getAttribute("data-d");
  if(d){const n=cur+ +d; if(n>=0&&n<STEPS.length) show(n);}
});
const start=Math.max(0,STEPS.findIndex(s=>"#"+s.id===location.hash));
show(start<0?0:start);
</script>
</body>
</html>
