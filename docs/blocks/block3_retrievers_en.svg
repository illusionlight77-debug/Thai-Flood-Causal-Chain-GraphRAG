<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">
  <defs><marker id="a3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a42"/></marker></defs>
  <rect width="980" height="560" fill="#f6efe1"/>
  <rect x="0" y="0" width="980" height="58" fill="#e6efe6"/>
  <text x="30" y="30" font-size="21" font-weight="700" fill="#245c37" font-family="Georgia,serif">③ 3 Retrievers — the core (contribution) ★</text>
  <text x="30" y="50" font-size="13.5" fill="#5a7a5a">src/rag/*.py — same question in, 3 systems "think" differently → different answer shapes</text>

  <rect x="30" y="80" width="230" height="60" rx="10" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="145" y="106" font-size="13.5" font-weight="700" fill="#3a2f22" text-anchor="middle">same question</text>
  <text x="145" y="126" font-size="12" fill="#8a6d3b" text-anchor="middle">"Why did province X flood?"</text>
  <path d="M262,110 L300,110" stroke="#6a5a42" stroke-width="2" fill="none"/>
  <path d="M300,110 L300,175 L326,175" stroke="#6a5a42" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <path d="M300,110 L300,320 L326,320" stroke="#6a5a42" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <path d="M300,110 L300,435 L326,435" stroke="#6a5a42" stroke-width="2" fill="none" marker-end="url(#a3)"/>

  <rect x="330" y="150" width="620" height="100" rx="10" fill="#eef3ec" stroke="#2f7d4a" stroke-width="2.4"/>
  <text x="346" y="174" font-size="14.5" font-weight="700" fill="#245c37">causal-graphrag <tspan font-size="11" fill="#7a8a5a">(ours)</tspan></text>
  <text x="346" y="196" font-size="12" fill="#3a2f22">Cypher walks real flow direction <tspan font-family="monospace" fill="#2f6b8a">*2..8</tspan> · gate: reach overflow + province not diked</text>
  <text x="346" y="216" font-size="12" fill="#3a2f22">→ flooded provinces + <tspan font-weight="700">full chain</tspan> (rain→dam→river→prov.) + <tspan font-weight="700" fill="#c0492f">evidence[]</tspan></text>
  <text x="346" y="238" font-size="12" fill="#245c37" font-weight="700">✓ traceable · ✓ points to a specific root cause</text>

  <rect x="330" y="266" width="620" height="94" rx="10" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="346" y="290" font-size="14.5" font-weight="700" fill="#3a2f22">entity-graphrag <tspan font-size="11" fill="#a58a5a">(relational baseline)</tspan></text>
  <text x="346" y="311" font-size="12" fill="#3a2f22">walks the graph <tspan font-weight="700">ignoring direction</tspan> <tspan font-family="monospace">*2..4</tspan> — "provinces linked in the graph" (no threshold)</text>
  <text x="346" y="331" font-size="12" fill="#3a2f22">→ over-predicts (includes upstream / non-flooded) · chain is relational, not causal</text>
  <text x="346" y="351" font-size="12" fill="#a5583f">✗ no evidence → traceability = 0</text>

  <rect x="330" y="376" width="620" height="94" rx="10" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="346" y="400" font-size="14.5" font-weight="700" fill="#3a2f22">vector-rag <tspan font-size="11" fill="#a58a5a">(baseline)</tspan></text>
  <text x="346" y="421" font-size="12" fill="#3a2f22">TF-IDF (char n-gram, Thai has no spaces) finds most similar news top-k → extract province names</text>
  <text x="346" y="441" font-size="12" fill="#3a2f22">→ only provinces the news "reports" (big ones stand out, tail provinces get missed)</text>
  <text x="346" y="461" font-size="12" fill="#a5583f">✗ no chain/evidence → traceability = 0</text>

  <rect x="30" y="490" width="920" height="56" rx="10" fill="#fbf3e6" stroke="#b8801f" stroke-width="1.4"/>
  <text x="46" y="512" font-size="12.8" fill="#3a2f22">• all 3 can answer "which provinces flooded" (F1 is measured equally) — <tspan font-weight="700" fill="#245c37">but only causal can say "why" with evidence</tspan></text>
  <text x="46" y="533" font-size="12.8" fill="#3a2f22">• causal's chain comes from <tspan font-weight="700">Cypher only</tspan>, never guessed by the LLM → results are reproducible (deterministic explanation)</text>
</svg>
