<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">
  <defs><marker id="a2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d3b"/></marker></defs>
  <rect width="980" height="470" fill="#f6efe1"/>
  <rect x="0" y="0" width="980" height="58" fill="#efe3cc"/>
  <text x="30" y="30" font-size="21" font-weight="700" fill="#3a2f22" font-family="Georgia,serif">② Geo Mapping — basin → province</text>
  <text x="30" y="50" font-size="13.5" fill="#8a6d3b">src/geo/basin_to_province.py — GeoPandas point-in-polygon: reach outlet → downstream province + lay down the answer key</text>

  <text x="30" y="90" font-size="13" font-weight="700" fill="#2f6b8a">Inputs (geospatial layers)</text>
  <g font-size="12" fill="#3a2f22">
    <rect x="30" y="102" width="240" height="34" rx="6" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="1.4"/><text x="42" y="123">reach outlet points<tspan fill="#a58a5a"> .geojson</tspan></text>
    <rect x="30" y="142" width="240" height="34" rx="6" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="1.4"/><text x="42" y="163">province boundaries<tspan fill="#a58a5a"> .geojson</tspan></text>
    <rect x="30" y="182" width="240" height="34" rx="6" fill="#fbeee9" stroke="#c0492f" stroke-width="1.4"/><text x="42" y="203">real flood extent<tspan fill="#a5583f"> GISTDA</tspan></text>
  </g>
  <path d="M275,160 L320,160" stroke="#8a6d3b" stroke-width="2" fill="none" marker-end="url(#a2)"/>

  <rect x="325" y="96" width="300" height="90" rx="10" fill="#eef3ec" stroke="#2f7d4a" stroke-width="2"/>
  <text x="475" y="120" font-size="13.5" font-weight="700" fill="#245c37" text-anchor="middle">reproject → sjoin (within)</text>
  <text x="340" y="142" font-size="11.5" fill="#3a2f22">all layers to EPSG:32647 before join</text>
  <text x="340" y="160" font-size="11.5" fill="#3a2f22">which province holds the outlet → INUNDATES</text>
  <text x="340" y="178" font-size="11" fill="#c0492f">rule: no outlet may fall outside a polygon (raise)</text>

  <rect x="325" y="200" width="300" height="86" rx="10" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="475" y="224" font-size="13.5" font-weight="700" fill="#3a2f22" text-anchor="middle">overlay flood × province</text>
  <text x="340" y="246" font-size="11.5" fill="#3a2f22">intersection ≥ 50% of province area</text>
  <text x="340" y="264" font-size="11.5" fill="#3a2f22">→ "truly flooded" province = gold key</text>
  <text x="340" y="281" font-size="11" fill="#a58a5a">guards against border slivers of real polygons</text>

  <path d="M628,140 L672,140" stroke="#8a6d3b" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <path d="M628,243 L672,243" stroke="#8a6d3b" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <g font-size="12">
    <polygon points="700,118 855,118 838,162 683,162" fill="#f3f0e8" stroke="#8a6d3b" stroke-width="1.6"/>
    <text x="770" y="138" font-weight="700" fill="#3a2f22" text-anchor="middle">inundates_edges.json</text>
    <text x="770" y="154" fill="#8a6d3b" text-anchor="middle" font-size="11">→ into graph ①</text>
    <polygon points="700,221 855,221 838,265 683,265" fill="#fbeee9" stroke="#c0492f" stroke-width="1.6"/>
    <text x="770" y="241" font-weight="700" fill="#c0492f" text-anchor="middle">gold_provinces.json</text>
    <text x="770" y="257" fill="#a5583f" text-anchor="middle" font-size="11">→ answer key for eval ④</text>
  </g>

  <rect x="30" y="322" width="820" height="118" rx="10" fill="#fbf3e6" stroke="#b8801f" stroke-width="1.4"/>
  <text x="46" y="346" font-size="13" font-weight="700" fill="#8a6d3b">Why this way / why it is trustworthy</text>
  <text x="46" y="368" font-size="12.5" fill="#3a2f22">• river→province matched by point-in-polygon on real boundaries — we do not hand-declare which reach floods which province</text>
  <text x="46" y="389" font-size="12.5" fill="#3a2f22">• <tspan font-weight="700" fill="#c0492f">CRS must match before join</tspan> (EPSG:32647) — otherwise wrong province; enforced, no outlet may fall outside</text>
  <text x="46" y="410" font-size="12.5" fill="#3a2f22">• the gold key comes purely from <tspan font-weight="700">satellite imagery</tspan> — external truth the model never sees</text>
  <text x="46" y="431" font-size="12.5" fill="#3a2f22">• the ≥50% overlap cutoff is to reject border slivers, not to make results look good</text>
</svg>
