<svg viewBox="0 0 1500 840" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'IBM Plex Sans Thai', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22456b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="840" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="0" y="0" width="1500" height="92" fill="#dfe7f3"/>
  <text x="60" y="45" font-size="30" font-weight="700" fill="#22456b">System Overview:
    <tspan fill="#c0492f">Causal-Chain GraphRAG for Flood Explanation</tspan>
  </text>
  <text x="60" y="76" font-size="17" fill="#4a5f7a">"ทำไมจังหวัดนี้ถึงน้ำท่วม?" — เดินตามสายเหตุ-ผลจริง แล้ววัดว่าอธิบายได้ verify กว่า vector search ไหม</text>

  <!-- ===== Actor: Real Data Sources ===== -->
  <g transform="translate(90,400)">
    <circle cx="0" cy="-14" r="16" fill="#2b6cb0"/>
    <path d="M-26,26 a26,26 0 0 1 52,0 z" fill="#2b6cb0"/>
    <circle cx="-34" cy="-6" r="12" fill="#5b8fd0"/>
    <path d="M-54,26 a20,20 0 0 1 40,0 z" fill="#5b8fd0"/>
    <circle cx="34" cy="-6" r="12" fill="#5b8fd0"/>
    <path d="M14,26 a20,20 0 0 1 40,0 z" fill="#5b8fd0"/>
  </g>
  <text x="90" y="470" font-size="18" font-weight="700" fill="#1a3350" text-anchor="middle">Real Data Sources</text>
  <text x="90" y="492" font-size="12.5" fill="#4a5f7a" text-anchor="middle">GISTDA · RID gauges</text>
  <text x="90" y="509" font-size="12.5" fill="#4a5f7a" text-anchor="middle">DEM · thaiwater</text>

  <!-- ===== Top input parallelograms ===== -->
  <!-- Input 1 -->
  <polygon points="235,175 445,175 415,240 205,240" fill="#eef3fa" stroke="#22456b" stroke-width="1.6"/>
  <text x="325" y="200" font-size="14.5" font-weight="600" fill="#1a3350" text-anchor="middle">Basin Config + Event Dates</text>
  <text x="325" y="220" font-size="12" fill="#4a5f7a" text-anchor="middle">8 sub-basins · 23 provinces</text>
  <text x="325" y="235" font-size="12" fill="#4a5f7a" text-anchor="middle">2022 · 2021 · 2024 · 2023</text>
  <!-- elbow down into box1 -->
  <path d="M320,240 L320,365" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Input 2 -->
  <polygon points="1015,175 1215,175 1185,240 985,240" fill="#fbeee9" stroke="#22456b" stroke-width="1.6"/>
  <text x="1100" y="200" font-size="14.5" font-weight="600" fill="#1a3350" text-anchor="middle">Ground Truth</text>
  <text x="1100" y="220" font-size="12" fill="#4a5f7a" text-anchor="middle">GISTDA satellite flood extent</text>
  <text x="1100" y="235" font-size="12" fill="#4a5f7a" text-anchor="middle">(≥10,000 rai cutoff)</text>
  <path d="M1095,240 L1095,365" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== Main process row (y 365-445) ===== -->
  <!-- box1 Ingest -->
  <rect x="190" y="365" width="180" height="80" rx="3" fill="#ffffff" stroke="#22456b" stroke-width="1.8"/>
  <text x="280" y="398" font-size="15.5" font-weight="700" fill="#1a3350" text-anchor="middle">Ingestion &amp;</text>
  <text x="280" y="418" font-size="15.5" font-weight="700" fill="#1a3350" text-anchor="middle">Graph Build</text>
  <text x="280" y="436" font-size="11.5" fill="#7a5a2f" text-anchor="middle">src/ingest</text>

  <!-- box2 Geo -->
  <rect x="410" y="365" width="180" height="80" rx="3" fill="#ffffff" stroke="#22456b" stroke-width="1.8"/>
  <text x="500" y="398" font-size="15.5" font-weight="700" fill="#1a3350" text-anchor="middle">Geo Mapping</text>
  <text x="500" y="418" font-size="14" fill="#1a3350" text-anchor="middle">basin → province</text>
  <text x="500" y="436" font-size="11.5" fill="#7a5a2f" text-anchor="middle">src/geo</text>

  <!-- box3 Retrievers (our contrast) -->
  <rect x="630" y="365" width="200" height="80" rx="3" fill="#eef6ef" stroke="#22456b" stroke-width="2.2"/>
  <text x="730" y="396" font-size="15.5" font-weight="700" fill="#1a3350" text-anchor="middle">3 Retrievers</text>
  <text x="730" y="416" font-size="12.5" fill="#2f6b3a" text-anchor="middle">causal · entity · vector</text>
  <text x="730" y="436" font-size="11.5" fill="#7a5a2f" text-anchor="middle">src/rag</text>

  <!-- box4 Eval -->
  <rect x="870" y="365" width="180" height="80" rx="3" fill="#ffffff" stroke="#22456b" stroke-width="1.8"/>
  <text x="960" y="398" font-size="15.5" font-weight="700" fill="#1a3350" text-anchor="middle">Evaluation</text>
  <text x="960" y="418" font-size="14" fill="#1a3350" text-anchor="middle">vs ground truth</text>
  <text x="960" y="436" font-size="11.5" fill="#7a5a2f" text-anchor="middle">src/eval</text>

  <!-- output: results -->
  <polygon points="1120,365 1330,365 1300,445 1090,445" fill="#eef3fa" stroke="#22456b" stroke-width="1.8"/>
  <text x="1210" y="393" font-size="15" font-weight="700" fill="#1a3350" text-anchor="middle">Research Results</text>
  <text x="1210" y="413" font-size="11.5" fill="#4a5f7a" text-anchor="middle">F1-by-hop · Traceability</text>
  <text x="1210" y="429" font-size="11.5" fill="#4a5f7a" text-anchor="middle">Specificity · Significance</text>

  <!-- horizontal main arrows -->
  <path d="M133,400 L188,400" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M370,405 L408,405" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M590,405 L628,405" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M830,405 L868,405" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1050,405 L1088,405" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== Storage cylinder (Neo4j graph) ===== -->
  <!-- box2 down to cylinder -->
  <path d="M500,445 L500,545" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g>
    <path d="M420,560 a80,16 0 0 1 160,0 v70 a80,16 0 0 1 -160,0 z" fill="#f3f0e8" stroke="#22456b" stroke-width="1.8"/>
    <path d="M420,560 a80,16 0 0 0 160,0" fill="none" stroke="#22456b" stroke-width="1.8"/>
    <text x="500" y="600" font-size="14.5" font-weight="700" fill="#1a3350" text-anchor="middle">Neo4j Causal</text>
    <text x="500" y="620" font-size="14.5" font-weight="700" fill="#1a3350" text-anchor="middle">Graph</text>
    <text x="500" y="642" font-size="11" fill="#4a5f7a" text-anchor="middle">+ processed JSON</text>
  </g>
  <!-- cylinder feeds retrievers (query graph) -->
  <path d="M580,600 L730,600 L730,447" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== DEM validation loop into eval ===== -->
  <rect x="860" y="560" width="200" height="72" rx="3" fill="#ffffff" stroke="#22456b" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="960" y="590" font-size="14.5" font-weight="700" fill="#1a3350" text-anchor="middle">DEM Topology</text>
  <text x="960" y="610" font-size="12.5" fill="#1a3350" text-anchor="middle">Validation (4 checks)</text>
  <text x="960" y="626" font-size="11.5" fill="#7a5a2f" text-anchor="middle">src/geo · pysheds</text>
  <path d="M960,560 L960,447" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== Extension output ===== -->
  <path d="M1210,445 L1210,545" fill="none" stroke="#22456b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polygon points="1130,560 1330,560 1305,635 1105,635" fill="#fbf3e6" stroke="#b8801f" stroke-width="1.8"/>
  <text x="1215" y="588" font-size="14.5" font-weight="700" fill="#7a5a2f" text-anchor="middle">Extension</text>
  <text x="1215" y="608" font-size="12" fill="#7a5a2f" text-anchor="middle">Early Warning / Risk</text>
  <text x="1215" y="624" font-size="11" fill="#9a7a3f" text-anchor="middle">prob · lead-time · Hazard×Exp×Vuln</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(60,720)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1a3350">Legend:</text>
    <rect x="70" y="-13" width="28" height="18" fill="#ffffff" stroke="#22456b" stroke-width="1.6"/>
    <text x="106" y="1" font-size="13" fill="#4a5f7a">Process (code module)</text>
    <polygon points="300,-13 348,-13 340,5 292,5" fill="#eef3fa" stroke="#22456b" stroke-width="1.6"/>
    <text x="356" y="1" font-size="13" fill="#4a5f7a">Data in / out</text>
    <path d="M470,-16 a24,6 0 0 1 48,0 v18 a24,6 0 0 1 -48,0 z" fill="#f3f0e8" stroke="#22456b" stroke-width="1.6"/>
    <text x="526" y="1" font-size="13" fill="#4a5f7a">Storage</text>
    <rect x="610" y="-13" width="28" height="18" fill="#ffffff" stroke="#22456b" stroke-width="1.6" stroke-dasharray="4 2"/>
    <text x="646" y="1" font-size="13" fill="#4a5f7a">Independent validation</text>
    <rect x="850" y="-13" width="28" height="18" fill="#eef6ef" stroke="#22456b" stroke-width="2.2"/>
    <text x="886" y="1" font-size="13" fill="#4a5f7a">Our contribution</text>
  </g>

  <text x="1440" y="815" font-size="13" fill="#8a97a8" text-anchor="end">Thai Flood Causal-Chain GraphRAG</text>
</svg>
