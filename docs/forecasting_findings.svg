<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans Thai','Segoe UI',Arial,sans-serif">
  <rect width="1180" height="760" fill="#f6efe1"/>
  <text x="34" y="44" font-size="23" font-weight="700" fill="#8a6d3b" font-family="Georgia,serif">Plan A — การค้นพบ + ปรับปรุงให้ซื่อสัตย์และวัดจริง (2026-09-06)</text>
  <text x="34" y="67" font-size="13.5" fill="#9a7a3f">Causal-chain flood attribution: from an over-flag artifact to an honest, reproducible, survey-grounded model · 5 เหตุการณ์เจ้าพระยา</text>

  <!-- discovery band -->
  <rect x="34" y="84" width="1112" height="74" rx="12" fill="#fbeee9" stroke="#c0492f" stroke-width="1.6"/>
  <text x="48" y="108" font-size="14" font-weight="700" fill="#c0492f">🔴 การค้นพบสำคัญ — ตัวเลขเดิมเป็น artifact</text>
  <text x="48" y="130" font-size="12.5" fill="#3a2f22">F1 0.9 / CSI 0.8 เดิมมาจาก <tspan font-weight="700">gate ที่ over-flag</tspan> ("สถานีย่อยไหนล้น = ทั้งลุ่มท่วม") + repo ไม่ตรงกันเงียบ ๆ. ตรวจฟิสิกส์: เจ้าพระยาสายหลัก (C.2 นครสวรรค์)</text>
  <text x="48" y="150" font-size="12.5" fill="#3a2f22"><tspan font-weight="700">ไม่เคยล้นตลิ่งเลย 2564–2568</tspan> (พีค 23.5 &lt; ตลิ่ง 25.7 ม.) → จังหวัดท่วมจาก local/สาขา. แก้เป็น per-reach gauge ที่ snap ถูก + de-circularized.</text>

  <!-- improvements pipeline -->
  <text x="34" y="188" font-size="14" font-weight="700" fill="#2f6b8a">▸ ปรับปรุงด้วยแนวทางมี paper รองรับ (วัดจริง ไม่จูน gold)</text>
  <g font-size="11.5" text-anchor="middle">
    <g><rect x="34" y="200" width="252" height="56" rx="9" fill="#eef3ec" stroke="#2f7d4a" stroke-width="1.8"/><text x="160" y="222" font-weight="700" fill="#245c37">Fluvial: 2-yr return stage</text><text x="160" y="240" fill="#2f6b3a">bankfull onset (Leopold 1994)</text></g>
    <g><rect x="320" y="200" width="252" height="56" rx="9" fill="#eef3ec" stroke="#2f7d4a" stroke-width="1.8"/><text x="446" y="222" font-weight="700" fill="#245c37">Pluvial multi-duration</text><text x="446" y="240" fill="#2f6b3a">ฝน 3-วัน หรือ 30-วัน ≥ Gumbel T10</text></g>
    <g><rect x="606" y="200" width="252" height="56" rx="9" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="1.6"/><text x="732" y="222" font-weight="700" fill="#3a2f22">เมตริก: MCC + PNS</text><text x="732" y="240" fill="#8a6d3b">Chicco&amp;Jurman 2020 · Pearl PNS</text></g>
    <g><rect x="892" y="200" width="254" height="56" rx="9" fill="#fbf3e6" stroke="#b8801f" stroke-width="1.6"/><text x="1019" y="222" font-weight="700" fill="#8a6d3b">de-circularized + LOEO</text><text x="1019" y="240" fill="#9a7a3f">threshold จาก climatology ไม่ใช่ gold</text></g>
  </g>

  <!-- KPI tiles: old -> new -->
  <text x="34" y="292" font-size="14" font-weight="700" fill="#2f6b8a">▸ ผลหลัก (เก่า→ใหม่, วัดจริง)</text>
  <g>
    <rect x="34" y="304" width="270" height="98" rx="12" fill="#eef6ef" stroke="#2f7d4a" stroke-width="2"/>
    <text x="48" y="330" font-size="13.5" font-weight="700" fill="#245c37">A causal — F1 / recall</text>
    <text x="48" y="357" font-size="24" font-weight="800" fill="#2f7d4a" font-family="monospace">F1 0.548→0.795</text>
    <text x="48" y="380" font-size="12.5" fill="#3a2f22">recall 0.41→0.81 · แข่ง entity (0.844) ได้</text>
    <text x="48" y="396" font-size="11" fill="#5a7a5a">grounded thresholds ยก recall จริง</text>

    <rect x="316" y="304" width="270" height="98" rx="12" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="2"/>
    <text x="330" y="330" font-size="13.5" font-weight="700" fill="#3a2f22">MCC — เมตริกที่ถูกต้อง</text>
    <text x="330" y="357" font-size="24" font-weight="800" fill="#8a6d3b" font-family="monospace">+0.203 vs 0</text>
    <text x="330" y="380" font-size="12.5" fill="#3a2f22">causal เดียวที่ MCC&gt;0 · entity F1 สูงแต่ MCC=0</text>
    <text x="330" y="396" font-size="11" fill="#a5583f">F1 ถูก game เมื่อ base-rate ท่วมสูง</text>

    <rect x="598" y="304" width="270" height="98" rx="12" fill="#eef3ec" stroke="#2f7d4a" stroke-width="2"/>
    <text x="612" y="330" font-size="13.5" font-weight="700" fill="#245c37">Traceability (faithfulness)</text>
    <text x="612" y="357" font-size="24" font-weight="800" fill="#2f7d4a" font-family="monospace">~0.90 vs 0</text>
    <text x="612" y="380" font-size="12.5" fill="#3a2f22">ทุก edge มี evidence · "correctness≠faithfulness"</text>
    <text x="612" y="396" font-size="11" fill="#5a7a5a">baseline อธิบายที่มาไม่ได้ (=0)</text>

    <rect x="880" y="304" width="266" height="98" rx="12" fill="#fbf3e6" stroke="#b8801f" stroke-width="2"/>
    <text x="894" y="330" font-size="13.5" font-weight="700" fill="#8a6d3b">B warning (CSI)</text>
    <text x="894" y="357" font-size="24" font-weight="800" fill="#b8801f" font-family="monospace">0.378→0.660</text>
    <text x="894" y="380" font-size="12.5" fill="#3a2f22">POD 0.81 · (0.802 เดิม = gate over-flag)</text>
    <text x="894" y="396" font-size="11" fill="#9a7a3f">2yr-stage + multi-duration ยก recall</text>
  </g>

  <!-- PNS -->
  <text x="34" y="440" font-size="14" font-weight="700" fill="#2f6b8a">▸ Necessity / Sufficiency ต่อกลไก (counterfactual PNS — intervention ตัดกลไกออก)</text>
  <g font-size="12" fill="#3a2f22">
    <rect x="34" y="452" width="700" height="112" rx="10" fill="#fbf6ec" stroke="#8a6d3b" stroke-width="1.4"/>
    <text x="48" y="474" font-weight="700" fill="#8a6d3b">กลไก</text><text x="330" y="474" font-weight="700" fill="#8a6d3b" text-anchor="middle">Necessity</text><text x="470" y="474" font-weight="700" fill="#8a6d3b" text-anchor="middle">Sufficiency</text><text x="640" y="474" font-weight="700" fill="#8a6d3b" text-anchor="middle">Δrecall ถ้าตัด</text>
    <text x="48" y="500">fluvial (2-yr stage)</text><text x="330" y="500" text-anchor="middle" font-weight="700">0.35</text><text x="470" y="500" text-anchor="middle">0.79</text><text x="640" y="500" text-anchor="middle" fill="#c0492f">−0.286</text>
    <text x="48" y="524">pluvial-30วัน (ฝนตกยาว)</text><text x="330" y="524" text-anchor="middle">0.21</text><text x="470" y="524" text-anchor="middle">0.77</text><text x="640" y="524" text-anchor="middle" fill="#c0492f">−0.167</text>
    <text x="48" y="548">pluvial-3วัน (ฝนกระหน่ำ)</text><text x="330" y="548" text-anchor="middle">0.00</text><text x="470" y="548" text-anchor="middle" font-weight="700">0.85</text><text x="640" y="548" text-anchor="middle">0.000</text>
    <text x="48" y="562" font-size="10.5" fill="#8a6d3b" font-style="italic">fluvial จำเป็นสุด · pluvial-30วันเติมเคสฝนตกยาว (2566) · ทุกกลไก sufficiency สูง = ยิงแล้วมักถูก</text>
  </g>
  <g>
    <rect x="750" y="452" width="396" height="112" rx="10" fill="#eef6ef" stroke="#2f7d4a" stroke-width="1.6"/>
    <text x="764" y="474" font-size="12.5" font-weight="700" fill="#245c37">PR ตามจำนวนกลไกที่เห็นตรงกัน (corroboration)</text>
    <text x="764" y="500" font-size="12.5" fill="#3a2f22">≥1 กลไก: precision <tspan font-weight="700">0.782</tspan> · recall 0.82</text>
    <text x="764" y="524" font-size="12.5" fill="#3a2f22">≥2 กลไกยืนยันตรงกัน: precision <tspan font-weight="700" fill="#2f7d4a">0.833</tspan> · recall 0.36</text>
    <text x="764" y="550" font-size="11.5" fill="#5a7a5a" font-style="italic">หลายสายเหตุ-ผลตรงกัน = ความมั่นใจสูงขึ้น</text>
    <text x="764" y="558" font-size="0" fill="#5a7a5a"> </text>
  </g>

  <!-- honest finding banner -->
  <rect x="34" y="580" width="1112" height="94" rx="12" fill="#fbf3e6" stroke="#b8801f" stroke-width="1.4"/>
  <text x="48" y="604" font-size="13.5" font-weight="700" fill="#8a6d3b">🎯 finding เชิงวิชาการ (ซื่อสัตย์)</text>
  <text x="48" y="626" font-size="12.5" fill="#3a2f22">• <tspan font-weight="700">MCC นิ่งที่ ~0.20 ทุก variant</tspan> (min_bank 0.197 · 2yr-stage 0.201 · +multi-duration 0.203) = <tspan font-weight="700">เพดาน skill จริง</tspan> ของสัญญาณเชิงฟิสิกส์ — เกณฑ์ grounded เลื่อนบนเส้น recall–precision ได้ แต่ไม่ทะลุเพดาน</text>
  <text x="48" y="647" font-size="12.5" fill="#3a2f22">• <tspan font-weight="700">causal = ระบบเดียวที่ traceable 100% + MCC&gt;0</tspan> (entity เดาท่วมหมด F1 สูงแต่ MCC=0 = ไม่มี skill) · contribution = <tspan font-weight="700">faithful/attributable flood prediction</tspan> ไม่ใช่แค่ correct</text>
  <text x="48" y="668" font-size="12.5" fill="#3a2f22">• ทุกอย่าง <tspan font-weight="700">วัดจริง · de-circularized · reproducible · ไม่จูน gold</tspan> — เก่า→ใหม่รายงานคู่กัน (ดู docs/HISTORY.md)</text>

  <!-- provenance -->
  <text x="34" y="700" font-size="11.5" fill="#6a5a42">ข้อมูล: GISTDA satellite (gold) · thaiwater river-gauge + ERA5-Land rain (gate, อิสระจาก gold) · เครื่องมือ: thaiwater_gauge · local_rain · build_ui_data · pns_ablation · case_bank</text>
  <text x="34" y="720" font-size="11.5" fill="#6a5a42">อ้างอิง: Leopold 1994 (bankfull) · Chicco &amp; Jurman 2020 (MCC&gt;F1) · Pearl PNS / FANS 2402.08845 · "Correctness≠Faithfulness" 2412.18004 · Gumbel FA — ดู docs/REFERENCES.md</text>
  <text x="34" y="742" font-size="11.5" fill="#8a97a8">Thai Flood Causal-Chain GraphRAG · Plan A — honest &amp; survey-grounded · ผล ณ 2026-09-06 (measured, reproducible)</text>
</svg>
